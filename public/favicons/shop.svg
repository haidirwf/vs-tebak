<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Adventurer Merchant Bag Body -->
  <path d="M14 20l-4 8v26a4 4 0 0 0 4 4h36a4 4 0 0 0 4-4V28l-4-8H14z" fill="url(#shop-bag-grad)" stroke="#047857" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Upper Fold / Flap -->
  <path d="M10 28h44v4H10z" fill="#047857" stroke="#065F46" stroke-width="1.5" />
  <!-- Golden Handle -->
  <path d="M24 20V12a8 8 0 0 1 16 0v8" stroke="url(#shop-gold-grad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M24 20V12a8 8 0 0 1 16 0v8" stroke="#FEF08A" stroke-width="1.5" stroke-linecap="round" />
  <!-- Center Star Emblem / Gold Coin -->
  <circle cx="32" cy="40" r="9" fill="url(#shop-gold-grad)" stroke="#B45309" stroke-width="2" />
  <!-- Five-pointed Star inside coin -->
  <polygon points="32,33 34.5,38 40,38.5 36,42 37.2,47 32,44 26.8,47 28,42 24,38.5 29.5,38" fill="#FFF" />
  <!-- Leather Straps -->
  <line x1="20" y1="28" x2="20" y2="58" stroke="#065F46" stroke-width="2" />
  <line x1="44" y1="28" x2="44" y2="58" stroke="#065F46" stroke-width="2" />
  <defs>
    <linearGradient id="shop-bag-grad" x1="10" y1="20" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shop-gold-grad" x1="24" y1="12" x2="40" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
</svg>